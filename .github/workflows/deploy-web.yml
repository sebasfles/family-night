name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - eslint.config.base.mjs
      - .nvmrc
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check shared and web
        run: |
          set -euo pipefail
          for workspace in shared web; do
            (cd "$workspace" && pnpm lint && pnpm typecheck && pnpm test)
          done

      - name: Build
        working-directory: web
        env:
          VITE_EVENTS_HTTP_DOMAIN: ${{ vars.VITE_EVENTS_HTTP_DOMAIN }}
          VITE_EVENTS_REALTIME_DOMAIN: ${{ vars.VITE_EVENTS_REALTIME_DOMAIN }}
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Upload
        working-directory: web
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          set -euo pipefail

          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "*" --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors
          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache" --only-show-errors

      - name: Invalidate
        env:
          DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

          echo "### Deployed $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
